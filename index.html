<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Подарунок Brawl Stars</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { background: #16213e; padding: 20px; border-radius: 20px; display: inline-block; border: 2px solid #ffd700; }
        .avatar { width: 100px; height: 100px; background: #e94560; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        button { background: #ffd700; border: none; padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #result { margin-top: 20px; display: none; padding: 15px; background: #0f3460; border-radius: 10px; }
        .disclaimer { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="avatar">🎁</div>
    <h1>Вітаємо!</h1>
    <p>Ви отримали подарунок: <b>200 гемів!</b></p>
    <button onclick="showData()">Отримати подарунок</button>

    <div id="result">
        <h3>Ваші технічні дані:</h3>
        <p id="ip-display">IP-адреса: завантаження...</p>
        <p>Ваш пристрій: <span id="ua-display"></span></p>
        <p class="disclaimer">Це демонстраційний проєкт для перевірки IP.</p>
    </div>
</div>

<script>
    function showData() {
        document.getElementById('result').style.display = 'block';
        document.getElementById('ua-display').innerText = navigator.userAgent;

        // Отримання IP через безкоштовний API
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip-display').innerText = "IP-адреса: " + data.ip;
            })
            .catch(() => {
                document.getElementById('ip-display').innerText = "Не вдалося отримати IP";
            });
    }
</script>

</body>
</html>
